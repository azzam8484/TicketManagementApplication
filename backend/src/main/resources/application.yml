spring:
  application:
    name: ticket-management
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

server:
  port: 8080

---
# Profile-specific files:
# - application-local.yml  (H2)
# - application-prod.yml   (PostgreSQL via env vars)
