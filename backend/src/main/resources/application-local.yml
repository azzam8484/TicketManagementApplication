# Local development profile — file-based H2 (survives app restart)
# Activate with: --spring.profiles.active=local (default)
# DB files are created under ./data/ (relative to the process working directory)

spring:
  datasource:
    url: jdbc:h2:file:./data/ticketdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
